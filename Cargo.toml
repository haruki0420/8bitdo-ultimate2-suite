[workspace]
resolver = "3"
members = [
    "crates/eightbitdo-protocol",
    "crates/eightbitdo-core",
    "crates/eightbitdo-cli",
    "crates/eightbitdo-gui",
    "crates/eightbitdo-uniffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/haruki0420/8bitdo-ultimate2-suite"
authors = ["haruki0420"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

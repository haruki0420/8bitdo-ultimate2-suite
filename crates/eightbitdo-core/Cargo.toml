[package]
name = "eightbitdo-core"
description = "Transport abstractions, session management and device I/O for the 8BitDo Ultimate 2 Bluetooth controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["ble"]
ble = ["dep:btleplug", "dep:futures-util", "dep:fs2", "dep:rustix", "dep:nix"]

[dependencies]
eightbitdo-protocol = { path = "../eightbitdo-protocol" }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
uuid = "1"
btleplug = { version = "0.13", optional = true }
futures-util = { version = "0.3", optional = true }
fs2 = { version = "0.4.3", optional = true }

[target.'cfg(unix)'.dependencies]
# Safe wrappers for `geteuid` and the `O_NOFOLLOW`/`O_NONBLOCK` flags used by
# the lock-file hardening. Windows uses `symlink_metadata` prechecks only (see
# `ble_lock`); keeping this Unix-only avoids a POSIX-only build dependency.
rustix = { version = "1.1.6", optional = true, default-features = false, features = ["fs", "process", "std"] }
# NSS-aware passwd lookup (`getpwuid_r`) for the per-user lock directory.
nix = { version = "0.29", optional = true, default-features = false, features = ["user"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints]
workspace = true

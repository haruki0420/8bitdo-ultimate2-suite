name: Review Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    steps:
      - name: Require the independent review label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [ "$ACTION" = "synchronize" ]; then
            # A label is not tied to a commit, so drop it whenever new commits
            # arrive. The reviewer must re-review and add it again.
            gh pr edit "$PR" --repo "$REPO" --remove-label reviewed >/dev/null 2>&1 || true
            echo "::error::New commits were pushed; independent review must be repeated."
            exit 1
          fi

          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          if ! grep -qx 'reviewed' <<<"$labels"; then
            echo "::error::Missing 'reviewed' label. An independent reviewer must review the diff and add the label."
            exit 1
          fi

          echo "Independent review label is present."

name: Desktop

# Tauri v2 desktop app (`apps/desktop`). The Rust side is an independent Cargo
# workspace (see apps/desktop/README.md), so the root CI jobs never build it.
# `crates/eightbitdo-core` / `crates/eightbitdo-protocol` are path dependencies
# of `src-tauri`, so changes there must run this workflow too.
#
# NOTE: `desktop-web` / `desktop-rust` are **advisory** (not required status
# checks).  Promoting them to required checks is a separate PR that changes the
# ruleset (see docs/BRANCH_PROTECTION.md).
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/eightbitdo-core/**"
      - "crates/eightbitdo-protocol/**"
      # `eightbitdo-core` inherits `version.workspace = true`, and
      # `src-tauri/Cargo.lock` pins that version, so a root version bump can
      # break the desktop `cargo check --locked`.
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/TAURI_PLAN.md"
      - "docs/DESIGN_TAURI.md"
      - "docs/design/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/desktop/**"
      - "crates/eightbitdo-core/**"
      - "crates/eightbitdo-protocol/**"
      # `eightbitdo-core` inherits `version.workspace = true`, and
      # `src-tauri/Cargo.lock` pins that version, so a root version bump can
      # break the desktop `cargo check --locked`.
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/TAURI_PLAN.md"
      - "docs/DESIGN_TAURI.md"
      - "docs/design/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-web:
    name: desktop-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from `packageManager` in apps/desktop/package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # `engines.node` is "^20.19.0 || >=22.12.0" (Vite 7); pin the version
          # recorded in apps/desktop/README.md instead of floating on *.
          node-version: "26.13.1"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build (tsc --noEmit + vite build)
        run: pnpm --dir apps/desktop build
      - name: Test (vitest run)
        run: pnpm --dir apps/desktop test

  desktop-rust:
    name: desktop-rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install WebKitGTK / GTK development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --locked

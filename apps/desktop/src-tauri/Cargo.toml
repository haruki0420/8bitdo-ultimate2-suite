[package]
name = "eightbitdo-desktop"
version = "0.1.0"
description = "Tauri v2 desktop shell for the 8BitDo Ultimate 2 suite"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/haruki0420/8bitdo-ultimate2-suite"
authors = ["haruki0420"]
publish = false

# Standalone workspace on purpose: the Tauri shell has a very different
# dependency graph (webkit2gtk, tao/wry) from the rest of the repository, and
# the root workspace at ../../.. must not pull it into every `cargo test
# --workspace` run.  Declaring an empty [workspace] table keeps this crate out
# of the root workspace instead of erroring with "package is not a member".
[workspace]

[lib]
name = "eightbitdo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.cargo]
# `eightbitdo-core` is a deliberate forward dependency for the next phase
# (BLE scan/connect/read commands) and is intentionally unused in this
# scaffold, so silence cargo's unused-dependency check for it.
unused_dependencies = "allow"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

# Shared protocol/session crates live in the root workspace and are consumed as
# plain path dependencies.  BLE is not wired up yet, so `eightbitdo-core` is
# built without its default `ble` feature (no btleplug/BlueZ link); the next
# phase that implements device I/O should flip this to the default features.
eightbitdo-core = { path = "../../../crates/eightbitdo-core", default-features = false }

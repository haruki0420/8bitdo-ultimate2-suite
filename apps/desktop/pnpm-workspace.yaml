# pnpm 12 reads project settings from this file (the "pnpm" field in
# package.json is no longer consulted).  `esbuild` (pulled in by Vite/Vitest)
# ships a postinstall step that verifies its native binary, so it must be
# allowed explicitly; otherwise `pnpm install --frozen-lockfile` fails with
# ERR_PNPM_IGNORED_BUILDS.
packages: []

allowBuilds:
  esbuild: true
